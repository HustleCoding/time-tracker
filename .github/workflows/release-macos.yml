name: release-macos

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-notarize-release:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}

      - name: Build universal DMG (Intel + Apple Silicon)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          pnpm tauri build \
            --target universal-apple-darwin \
            --bundles dmg \
            --ci \
            --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"${APPLE_SIGNING_IDENTITY}\",\"entitlements\":\"entitlements.plist\",\"hardenedRuntime\":true}}}"

      - name: Find DMG path
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' -print0 | xargs -0 ls -t | head -n 1)"
          echo "dmg=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Create pending DMG copy
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          DMG="${{ steps.paths.outputs.dmg }}"
          PENDING="${DMG%.dmg}_PENDING_NOTARIZATION.dmg"
          cp "$DMG" "$PENDING"
          echo "dmg=$PENDING" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact (before notarization)
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ github.ref_name }}
          path: ${{ steps.paths.outputs.dmg }}
          if-no-files-found: error

      - name: Upload pending DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ steps.pending.outputs.dmg }}

      - name: Prepare notarization key
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.APPLE_NOTARYTOOL_API_KEY_P8_BASE64 }}" | base64 -D > AuthKey.p8 2>/dev/null || \
          echo "${{ secrets.APPLE_NOTARYTOOL_API_KEY_P8_BASE64 }}" | base64 -d > AuthKey.p8

      - name: Notarize DMG (poll until accepted)
        id: notarize
        shell: bash
        run: |
          set -euo pipefail
          KEY_ID="${{ secrets.APPLE_NOTARYTOOL_KEY_ID }}"
          ISSUER_ID="${{ secrets.APPLE_NOTARYTOOL_ISSUER_ID }}"
          DMG="${{ steps.paths.outputs.dmg }}"

          echo "Submitting: $DMG"
          SUBMIT_JSON="$(xcrun notarytool submit "$DMG" \
            --key AuthKey.p8 \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --output-format json)"

          SUBMISSION_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$SUBMIT_JSON")"

          echo "Submission ID: $SUBMISSION_ID"
          echo "Notarization submission: $SUBMISSION_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check status locally:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`xcrun notarytool info $SUBMISSION_ID --keychain-profile time-tracker-notary\`" >> "$GITHUB_STEP_SUMMARY"
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"

          start_ts="$(date +%s)"
          deadline_seconds="$((5 * 60 * 60 + 45 * 60))"
          notarized="false"

          while true; do
            now_ts="$(date +%s)"
            elapsed="$((now_ts - start_ts))"
            if [ "$elapsed" -ge "$deadline_seconds" ]; then
              echo "Timed out waiting for notarization after $elapsed seconds."
              echo "Notarization is still processing on Apple's side."
              echo "Use the 'Finalize macOS notarization' workflow once it becomes Accepted."
              break
            fi

            INFO_JSON="$(xcrun notarytool info "$SUBMISSION_ID" \
              --key AuthKey.p8 \
              --key-id "$KEY_ID" \
              --issuer "$ISSUER_ID" \
              --output-format json 2>/dev/null || true)"

            if [ -z "$INFO_JSON" ]; then
              echo "Notary status check failed (temporary); retrying in 30s..."
              sleep 30
              continue
            fi

            STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' <<<"$INFO_JSON")"

            case "$STATUS" in
              Accepted)
                echo "Notarization Accepted."
                notarized="true"
                break
                ;;
              Invalid)
                echo "Notarization Invalid. Fetching log..."
                xcrun notarytool log "$SUBMISSION_ID" \
                  --key AuthKey.p8 \
                  --key-id "$KEY_ID" \
                  --issuer "$ISSUER_ID"
                exit 1
                ;;
              *)
                echo "Current status: ${STATUS:-In Progress}..."
                sleep 60
                ;;
            esac
          done

          echo "notarized=$notarized" >> "$GITHUB_OUTPUT"

      - name: Staple and validate
        if: steps.notarize.outputs.notarized == 'true'
        run: |
          xcrun stapler staple "${{ steps.paths.outputs.dmg }}"
          xcrun stapler validate "${{ steps.paths.outputs.dmg }}"

      - name: Upload DMG to GitHub Release
        if: steps.notarize.outputs.notarized == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: ${{ steps.paths.outputs.dmg }}

      - name: Publish release and remove pending DMG
        if: steps.notarize.outputs.notarized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          gh release edit "$TAG" --draft=false

          PENDING_BASENAME="$(basename "${{ steps.pending.outputs.dmg }}")"
          if gh release view "$TAG" --json assets -q ".assets[].name" | grep -Fxq "$PENDING_BASENAME"; then
            gh release delete-asset "$TAG" "$PENDING_BASENAME" -y
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Notarization pending notice
        if: steps.notarize.outputs.notarized != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Notarization still in progress." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pending DMG uploaded to the Release:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.pending.outputs.dmg }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "When the submission becomes Accepted, run the 'Finalize macOS notarization' workflow with:" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- submission_id: \`${{ steps.notarize.outputs.submission_id }}\`" >> "$GITHUB_STEP_SUMMARY"
