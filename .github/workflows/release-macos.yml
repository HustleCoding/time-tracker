name: release-macos

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-notarize-release:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}

      - name: Build universal DMG (Intel + Apple Silicon)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          pnpm tauri build \
            --target universal-apple-darwin \
            --bundles dmg \
            --ci \
            --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"${APPLE_SIGNING_IDENTITY}\"}}}"

      - name: Find DMG path
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' -print0 | xargs -0 ls -t | head -n 1)"
          echo "dmg=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Prepare notarization key
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.APPLE_NOTARYTOOL_API_KEY_P8_BASE64 }}" | base64 -D > AuthKey.p8 2>/dev/null || \
          echo "${{ secrets.APPLE_NOTARYTOOL_API_KEY_P8_BASE64 }}" | base64 -d > AuthKey.p8

      - name: Notarize DMG
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "time-tracker-notary" \
            --key AuthKey.p8 \
            --key-id "${{ secrets.APPLE_NOTARYTOOL_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_NOTARYTOOL_ISSUER_ID }}"

          xcrun notarytool submit "${{ steps.paths.outputs.dmg }}" \
            --keychain-profile "time-tracker-notary" \
            --wait \
            --timeout 110m

      - name: Staple and validate
        run: |
          xcrun stapler staple "${{ steps.paths.outputs.dmg }}"
          xcrun stapler validate "${{ steps.paths.outputs.dmg }}"

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.paths.outputs.dmg }}
